<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" width="360" height="400" role="img" aria-labelledby="t d">
  <title id="t">Illustration of Google's unverified app warning</title>
  <desc id="d">Simplified drawing of the warning screen. Step 1: tap Advanced. Step 2: tap Go to spam-purge.com (unsafe).</desc>
  <rect x="1" y="1" width="358" height="398" rx="16" fill="#ffffff" stroke="#d0d5dc" stroke-width="2"/>
  <text x="24" y="28" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8a94a3" letter-spacing="1">ILLUSTRATION</text>
  <path d="M24 62 l12 -22 l12 22 z" fill="#f9ab00"/>
  <rect x="34.5" y="48" width="3" height="7" fill="#ffffff"/>
  <rect x="34.5" y="57" width="3" height="2.5" fill="#ffffff"/>
  <text x="24" y="92" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#202124">Google hasn't verified this app</text>
  <text x="24" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368">The app is requesting access to sensitive</text>
  <text x="24" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368">info in your Google Account. Only continue</text>
  <text x="24" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368">if you know and trust the developer.</text>

  <rect x="24" y="176" width="140" height="36" rx="6" fill="#1a73e8"/>
  <text x="94" y="199" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Back to safety</text>

  <text x="24" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a73e8">Advanced</text>
  <rect x="16" y="228" width="80" height="26" rx="13" fill="none" stroke="#d93025" stroke-width="2.5"/>
  <circle cx="112" cy="241" r="12" fill="#d93025"/>
  <text x="112" y="246" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <line x1="24" y1="272" x2="336" y2="272" stroke="#e1e5ea" stroke-width="1"/>
  <text x="24" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368">Continue only if you understand the risks</text>
  <text x="24" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#5f6368">and trust the developer.</text>

  <text x="24" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a73e8">Go to spam-purge.com (unsafe)</text>
  <rect x="16" y="334" width="222" height="26" rx="13" fill="none" stroke="#d93025" stroke-width="2.5"/>
  <circle cx="254" cy="347" r="12" fill="#d93025"/>
  <text x="254" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
</svg>
